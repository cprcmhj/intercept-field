<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#080b0f">
<title>Intercept Field Tester</title>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@400;600;700;800&family=Barlow:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
:root {
  --bg:#080b0f; --surface:#0e1319; --panel:#121820; --border:#1c2535;
  --accent:#00d4ff; --green:#00e87a; --warn:#ffab00; --danger:#ff4060;
  --text:#dde6f0; --muted:#4a5a6e; --mono:'Barlow Condensed',sans-serif; --body:'Barlow',sans-serif;
}
* { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
html,body { height:100%; background:var(--bg); color:var(--text); font-family:var(--body); overflow-x:hidden; }

/* HEADER */
.header { background:var(--surface); border-bottom:1px solid var(--border);
  padding:16px 20px 12px; display:flex; align-items:center; justify-content:space-between;
  position:sticky; top:0; z-index:100; }
.logo { font-family:var(--mono); font-size:20px; font-weight:800; color:#fff; letter-spacing:0.05em; }
.logo span { color:var(--accent); }
.status-pill { display:flex; align-items:center; gap:8px; font-family:var(--mono);
  font-size:12px; font-weight:700; letter-spacing:0.1em; text-transform:uppercase; }
.status-dot { width:8px; height:8px; border-radius:50%; }
.status-dot.idle    { background:var(--muted); }
.status-dot.active  { background:var(--green); box-shadow:0 0 8px var(--green); animation:pulse 1.5s ease-in-out infinite; }
.status-dot.error   { background:var(--danger); }
@keyframes pulse { 0%,100%{opacity:1;transform:scale(1)} 50%{opacity:0.4;transform:scale(0.8)} }

.wrap { padding:20px; max-width:480px; margin:0 auto; }

/* CONFIG CARD */
.card { background:var(--surface); border:1px solid var(--border); border-radius:12px; padding:20px; margin-bottom:16px; }
.card-title { font-family:var(--mono); font-size:11px; font-weight:700; letter-spacing:0.15em;
  text-transform:uppercase; color:var(--muted); margin-bottom:16px; }

.field { margin-bottom:14px; }
.label { font-size:12px; font-weight:600; color:var(--muted); letter-spacing:0.05em; margin-bottom:6px; display:block; }
input, select { width:100%; background:var(--panel); border:1px solid var(--border); border-radius:8px;
  color:var(--text); font-family:var(--mono); font-size:15px; padding:12px 14px;
  outline:none; -webkit-appearance:none; transition:border-color 0.15s; }
input:focus, select:focus { border-color:var(--accent); }

/* GPS STATUS */
.gps-card { background:var(--panel); border:1px solid var(--border); border-radius:10px;
  padding:16px; margin-bottom:16px; }
.gps-title { font-family:var(--mono); font-size:11px; font-weight:700; letter-spacing:0.15em;
  text-transform:uppercase; color:var(--muted); margin-bottom:12px; display:flex; align-items:center; gap:8px; }
.gps-dot { width:8px; height:8px; border-radius:50%; background:var(--muted); flex-shrink:0; }
.gps-dot.locked { background:var(--green); box-shadow:0 0 6px var(--green); animation:pulse 2s ease-in-out infinite; }
.gps-dot.searching { background:var(--warn); animation:pulse 0.8s ease-in-out infinite; }

.coords-grid { display:grid; grid-template-columns:1fr 1fr; gap:10px; margin-bottom:10px; }
.coord-box { background:var(--surface); border:1px solid var(--border); border-radius:8px; padding:10px 12px; }
.coord-label { font-size:10px; color:var(--muted); text-transform:uppercase; letter-spacing:0.1em; margin-bottom:4px; }
.coord-val { font-family:var(--mono); font-size:16px; font-weight:700; color:var(--accent); }

.accuracy-row { font-family:var(--mono); font-size:12px; color:var(--muted); }
.accuracy-row span { color:var(--text); }

/* MAIN BUTTONS */
.btn-start { width:100%; padding:20px; border-radius:12px; border:none; cursor:pointer;
  font-family:var(--mono); font-size:18px; font-weight:800; letter-spacing:0.1em; text-transform:uppercase;
  background:linear-gradient(135deg,#00d4ff,#00e87a); color:#000;
  transition:all 0.2s; margin-bottom:12px; }
.btn-start:active { transform:scale(0.98); opacity:0.85; }
.btn-start:disabled { opacity:0.3; cursor:not-allowed; transform:none; }

.btn-end { width:100%; padding:18px; border-radius:12px; border:1px solid var(--danger); cursor:pointer;
  font-family:var(--mono); font-size:16px; font-weight:800; letter-spacing:0.1em; text-transform:uppercase;
  background:rgba(255,64,96,0.1); color:var(--danger);
  transition:all 0.2s; margin-bottom:12px; }
.btn-end:active { transform:scale(0.98); }
.btn-end:disabled { opacity:0.3; cursor:not-allowed; }

.btn-hb { width:100%; padding:14px; border-radius:10px; border:1px solid var(--accent); cursor:pointer;
  font-family:var(--mono); font-size:14px; font-weight:700; letter-spacing:0.1em; text-transform:uppercase;
  background:rgba(0,212,255,0.08); color:var(--accent);
  transition:all 0.2s; margin-bottom:16px; }
.btn-hb:active { transform:scale(0.98); }
.btn-hb:disabled { opacity:0.3; cursor:not-allowed; }

/* SESSION STATUS */
.session-card { background:var(--surface); border:1px solid rgba(0,232,122,0.25);
  border-radius:12px; padding:18px; margin-bottom:16px; display:none; }
.session-card.visible { display:block; }
.session-train { font-family:var(--mono); font-size:28px; font-weight:800; color:#fff; margin-bottom:4px; }
.session-id { font-family:var(--mono); font-size:11px; color:var(--muted); margin-bottom:14px; word-break:break-all; }

.session-stats { display:grid; grid-template-columns:repeat(3,1fr); gap:10px; margin-bottom:14px; }
.stat-box { background:var(--panel); border:1px solid var(--border); border-radius:8px; padding:10px; text-align:center; }
.stat-val { font-family:var(--mono); font-size:20px; font-weight:800; }
.stat-val.green  { color:var(--green);  }
.stat-val.accent { color:var(--accent); }
.stat-val.warn   { color:var(--warn);   }
.stat-label { font-size:10px; color:var(--muted); text-transform:uppercase; letter-spacing:0.08em; margin-top:2px; }

/* HEARTBEAT PROGRESS */
.hb-track { background:var(--border); border-radius:99px; height:4px; margin-bottom:6px; overflow:hidden; }
.hb-fill { height:100%; background:linear-gradient(90deg,var(--accent),var(--green));
  border-radius:99px; transition:width 1s linear; }
.hb-label { font-family:var(--mono); font-size:11px; color:var(--muted); text-align:right; }

/* LOG */
.log-card { background:var(--surface); border:1px solid var(--border); border-radius:12px; padding:16px; }
.log-title { font-family:var(--mono); font-size:11px; font-weight:700; letter-spacing:0.15em;
  text-transform:uppercase; color:var(--muted); margin-bottom:12px; }
.log { max-height:200px; overflow-y:auto; }
.log-entry { padding:6px 0; border-bottom:1px solid rgba(28,37,53,0.5);
  display:flex; gap:10px; align-items:baseline; font-family:var(--mono); font-size:12px; }
.log-entry:last-child { border-bottom:none; }
.log-time { color:var(--muted); flex-shrink:0; font-size:11px; }
.log-type { flex-shrink:0; width:70px; font-weight:700; }
.log-type.start { color:var(--green);  }
.log-type.hb    { color:var(--accent); }
.log-type.end   { color:var(--danger); }
.log-type.error { color:var(--warn);   }
.log-type.gps   { color:var(--muted);  }
.log-msg { color:#8a9ab0; font-size:12px; }

.note { background:rgba(255,171,0,0.08); border:1px solid rgba(255,171,0,0.2);
  border-radius:8px; padding:12px 14px; font-size:13px; color:#c9a83a; margin-bottom:16px; }
</style>
</head>
<body>

<div class="header">
<div style="display:flex;align-items:center;gap:10px;">
  <div class="logo">INTER<span>CEPT</span></div>
  <div class="env-badge test">TEST</div>
</div>  
  <div class="status-pill">
    <div class="status-dot idle" id="status-dot"></div>
    <span id="status-text">IDLE</span>
  </div>
</div>

<div class="wrap">

  <!-- CONFIG -->
  <div class="card">
    <div class="card-title">Session Configuration</div>

    <div class="field">
      <label class="label">Device Serial (14 digits)</label>
      <input type="text" id="device-serial" value="10000000000001" maxlength="14" inputmode="numeric"/>
    </div>

    <div class="field">
      <label class="label">Train Number</label>
      <input type="text" id="train-number" value="3504" maxlength="6"/>
    </div>

    <div class="field">
      <label class="label">Line</label>
      <select id="line-select">
        <option value="NEC">Northeast Corridor</option>
        <option value="NJCL">North Jersey Coast</option>
        <option value="RVL">Raritan Valley</option>
        <option value="ME">Morris & Essex</option>
        <option value="MAIN">Main Line</option>
        <option value="PVL">Pascack Valley</option>
        <option value="PJL">Port Jervis</option>
        <option value="ACL">Atlantic City</option>
        <option value="TEST" selected>Personal / Test</option>
      </select>
    </div>

    <div class="field">
      <label class="label">Auto-Heartbeat Interval</label>
      <select id="hb-interval">
        <option value="30000">Every 30 seconds</option>
        <option value="60000" selected>Every 60 seconds</option>
        <option value="180000">Every 3 minutes (production)</option>
      </select>
    </div>
  </div>

  <!-- GPS STATUS -->
  <div class="gps-card">
    <div class="gps-title">
      <div class="gps-dot searching" id="gps-dot"></div>
      <span id="gps-status">Acquiring GPS...</span>
    </div>
    <div class="coords-grid">
      <div class="coord-box">
        <div class="coord-label">Latitude</div>
        <div class="coord-val" id="cur-lat">--</div>
      </div>
      <div class="coord-box">
        <div class="coord-label">Longitude</div>
        <div class="coord-val" id="cur-lon">--</div>
      </div>
    </div>
    <div class="accuracy-row">Accuracy: <span id="cur-accuracy">--</span></div>
  </div>

  <!-- SESSION STATUS -->
  <div class="session-card" id="session-card">
    <div class="session-train" id="sess-train">Train --</div>
    <div class="session-id" id="sess-id">--</div>
    <div class="session-stats">
      <div class="stat-box"><div class="stat-val green" id="sess-hb">0</div><div class="stat-label">Heartbeats</div></div>
      <div class="stat-box"><div class="stat-val accent" id="sess-elapsed">0:00</div><div class="stat-label">Elapsed</div></div>
      <div class="stat-box"><div class="stat-val warn" id="sess-next">--</div><div class="stat-label">Next HB</div></div>
    </div>
    <div class="hb-track"><div class="hb-fill" id="hb-fill" style="width:0%"></div></div>
    <div class="hb-label" id="hb-label">Next heartbeat in --s</div>
  </div>

  <!-- BUTTONS -->
  <button class="btn-start" id="btn-start" onclick="startSession()">▶ Start Session</button>
  <button class="btn-hb"    id="btn-hb"    onclick="sendManualHeartbeat()" disabled>♥ Send Heartbeat Now</button>
  <button class="btn-end"   id="btn-end"   onclick="endSession()" disabled>■ End Session</button>

  <!-- LOG -->
  <div class="log-card">
    <div class="log-title">Event Log</div>
    <div class="log" id="log"></div>
  </div>

</div>

<script>
// ─── CONFIG ──────────────────────────────────────────────────
// Gen 2 Cloud Run URL for the working Intercept staging sessionEvent function.
const SESSION_EVENT_URL = "https://sessionevent-6ru4ambysq-ue.a.run.app";
const API_KEY  = "PEOE9hJImdGUm2nKgzMmHtAa092BcWD3";
// ─────────────────────────────────────────────────────────────

const HEADERS = { "Content-Type":"application/json", "x-api-key": API_KEY };

let sessionId     = null;
let currentLat    = null;
let currentLon    = null;
let currentAcc    = null;
let hbCount       = 0;
let startTime     = null;
let hbIntervalId  = null;
let hbCountdownId = null;
let nextHbIn      = 0;
let watchId       = null;

// ─────────────────────────────────────────────────────────────
//  GPS WATCH
// ─────────────────────────────────────────────────────────────
function startGPS() {
  if (!navigator.geolocation) {
    setGPSStatus("GPS not supported", false);
    addLog("gps", "Geolocation not supported on this device");
    return;
  }
  addLog("gps", "Acquiring GPS lock...");
  watchId = navigator.geolocation.watchPosition(
    pos => {
      currentLat = pos.coords.latitude;
      currentLon = pos.coords.longitude;
      currentAcc = Math.round(pos.coords.accuracy);
      document.getElementById("cur-lat").textContent  = currentLat.toFixed(6);
      document.getElementById("cur-lon").textContent  = currentLon.toFixed(6);
      document.getElementById("cur-accuracy").textContent = `±${currentAcc}m`;
      document.getElementById("gps-dot").className   = "gps-dot locked";
      document.getElementById("gps-status").textContent  = "GPS Locked";
    },
    err => {
      setGPSStatus("GPS Error: " + err.message, false);
      addLog("error", "GPS: " + err.message);
    },
    { enableHighAccuracy:true, maximumAge:5000, timeout:15000 }
  );
}

function setGPSStatus(text, locked) {
  document.getElementById("gps-status").textContent = text;
  document.getElementById("gps-dot").className = "gps-dot " + (locked ? "locked" : "searching");
}

function setStatus(text, state) {
  document.getElementById("status-text").textContent = text;
  document.getElementById("status-dot").className = "status-dot " + state;
}

// ─────────────────────────────────────────────────────────────
//  LOG
// ─────────────────────────────────────────────────────────────
function addLog(type, msg) {
  const log  = document.getElementById("log");
  const time = new Date().toLocaleTimeString("en-US", {hour12:false,hour:"2-digit",minute:"2-digit",second:"2-digit"});
  const el   = document.createElement("div");
  el.className = "log-entry";
  el.innerHTML = `<span class="log-time">${time}</span><span class="log-type ${type}">${type.toUpperCase()}</span><span class="log-msg">${msg}</span>`;
  log.insertBefore(el, log.firstChild);
}

// ─────────────────────────────────────────────────────────────
//  ELAPSED CLOCK
// ─────────────────────────────────────────────────────────────
let clockId = null;
function startClock() {
  startTime = Date.now();
  clockId = setInterval(() => {
    const s = Math.floor((Date.now()-startTime)/1000);
    document.getElementById("sess-elapsed").textContent =
      `${Math.floor(s/60)}:${String(s%60).padStart(2,"0")}`;
  }, 1000);
}

// ─────────────────────────────────────────────────────────────
//  HEARTBEAT COUNTDOWN
// ─────────────────────────────────────────────────────────────
function startHBCountdown(intervalMs) {
  nextHbIn = Math.floor(intervalMs / 1000);
  clearInterval(hbCountdownId);
  hbCountdownId = setInterval(() => {
    nextHbIn = Math.max(0, nextHbIn - 1);
    const pct = Math.round(((intervalMs/1000 - nextHbIn) / (intervalMs/1000)) * 100);
    document.getElementById("hb-fill").style.width  = pct + "%";
    document.getElementById("hb-label").textContent = `Next heartbeat in ${nextHbIn}s`;
    document.getElementById("sess-next").textContent = nextHbIn + "s";
    if (nextHbIn <= 0) nextHbIn = Math.floor(intervalMs/1000);
  }, 1000);
}


function deviceTimePayload() {
  const now = new Date();
  return {
    deviceTimeUTC: now.toISOString(),
    deviceTimeEST: now.toLocaleString("en-US", {
      timeZone:"America/New_York",
      year:"numeric", month:"2-digit", day:"2-digit",
      hour:"2-digit", minute:"2-digit", second:"2-digit",
      hour12:false
    }) + " ET"
  };
}

function telemetryPayload() {
  return {
    speed: null,
    gpsAccuracy: currentAcc ?? null,
    ...deviceTimePayload()
  };
}

// ─────────────────────────────────────────────────────────────
//  START SESSION
// ─────────────────────────────────────────────────────────────
async function startSession() {
  if (!currentLat || !currentLon) {
    alert("Waiting for GPS lock. Please wait a moment and try again.");
    return;
  }

  const serial     = document.getElementById("device-serial").value.trim();
  const trainNum   = document.getElementById("train-number").value.trim();
  const line       = document.getElementById("line-select").value;
  const intervalMs = parseInt(document.getElementById("hb-interval").value);

  if (!/^\d{14}$/.test(serial)) { alert("Device serial must be exactly 14 digits."); return; }
  if (!trainNum) { alert("Enter a train number."); return; }

  document.getElementById("btn-start").disabled = true;
  setStatus("STARTING", "active");

  try {
    const res  = await fetch(SESSION_EVENT_URL, {
      method:"POST", headers:HEADERS,
      body: JSON.stringify({
        eventType:"START", deviceSerial:serial, trainNumber:trainNum,
        lat:currentLat, lon:currentLon, line, appVersion:"field-tester-1.0", ...telemetryPayload()
      })
    });
    const data = await res.json();

    if (!res.ok) {
      addLog("error", data.error || "Start failed");
      setStatus("ERROR", "error");
      document.getElementById("btn-start").disabled = false;
      return;
    }

    sessionId = data.sessionId;
    hbCount   = 0;

    // Update UI
    document.getElementById("session-card").classList.add("visible");
    document.getElementById("sess-train").textContent = `Train ${trainNum}`;
    document.getElementById("sess-id").textContent    = `Session: ${sessionId}`;
    document.getElementById("btn-hb").disabled        = false;
    document.getElementById("btn-end").disabled       = false;

    setStatus("ACTIVE", "active");
    addLog("start", `Session started → ${sessionId.slice(0,16)}...`);
    startClock();
    startHBCountdown(intervalMs);

    // Auto heartbeat
    hbIntervalId = setInterval(() => sendAutoHeartbeat(serial, trainNum, line), intervalMs);

  } catch(e) {
    addLog("error", "Network error: " + e.message);
    setStatus("ERROR", "error");
    document.getElementById("btn-start").disabled = false;
  }
}

// ─────────────────────────────────────────────────────────────
//  AUTO HEARTBEAT
// ─────────────────────────────────────────────────────────────
async function sendAutoHeartbeat(serial, trainNum, line) {
  if (!sessionId || !currentLat || !currentLon) return;
  await sendHeartbeat(serial, trainNum, line);
  const intervalMs = parseInt(document.getElementById("hb-interval").value);
  startHBCountdown(intervalMs);
}

// ─────────────────────────────────────────────────────────────
//  MANUAL HEARTBEAT
// ─────────────────────────────────────────────────────────────
async function sendManualHeartbeat() {
  const serial   = document.getElementById("device-serial").value.trim();
  const trainNum = document.getElementById("train-number").value.trim();
  const line     = document.getElementById("line-select").value;
  await sendHeartbeat(serial, trainNum, line);
}

async function sendHeartbeat(serial, trainNum, line) {
  if (!sessionId || !currentLat || !currentLon) return;
  try {
    const res  = await fetch(SESSION_EVENT_URL, {
      method:"POST", headers:HEADERS,
      body: JSON.stringify({
        eventType:"HEARTBEAT", deviceSerial:serial, trainNumber:trainNum,
        lat:currentLat, lon:currentLon, sessionId, line, ...telemetryPayload()
      })
    });
    const data = await res.json();
    if (res.ok) {
      hbCount++;
      document.getElementById("sess-hb").textContent = hbCount;
      addLog("hb", `HB #${hbCount} → ${currentLat.toFixed(5)}, ${currentLon.toFixed(5)} (±${currentAcc}m)`);
    } else {
      addLog("error", data.error || "Heartbeat failed");
    }
  } catch(e) {
    addLog("error", "HB network error: " + e.message);
  }
}

// ─────────────────────────────────────────────────────────────
//  END SESSION
// ─────────────────────────────────────────────────────────────
async function endSession() {
  if (!sessionId) return;
  clearInterval(hbIntervalId);
  clearInterval(hbCountdownId);
  clearInterval(clockId);

  const serial   = document.getElementById("device-serial").value.trim();
  const trainNum = document.getElementById("train-number").value.trim();
  const line     = document.getElementById("line-select").value;

  document.getElementById("btn-end").disabled = true;
  document.getElementById("btn-hb").disabled  = true;
  setStatus("ENDING", "active");

  try {
    const res  = await fetch(SESSION_EVENT_URL, {
      method:"POST", headers:HEADERS,
      body: JSON.stringify({
        eventType:"END", deviceSerial:serial, trainNumber:trainNum,
        lat:currentLat||0, lon:currentLon||0, sessionId, line, ...telemetryPayload()
      })
    });
    const data = await res.json();
    if (res.ok) {
      addLog("end", `Session ended — ${hbCount} heartbeats sent`);
      setStatus("ENDED", "idle");
    } else {
      addLog("error", data.error || "End failed");
    }
  } catch(e) {
    addLog("error", "End network error: " + e.message);
  }

  sessionId = null;
  document.getElementById("btn-start").disabled = false;
  document.getElementById("hb-fill").style.width = "0%";
  document.getElementById("hb-label").textContent = "Session ended";
}

// ─────────────────────────────────────────────────────────────
//  INIT
// ─────────────────────────────────────────────────────────────
startGPS();

window.addEventListener("beforeunload", () => {
  if (watchId !== null) navigator.geolocation.clearWatch(watchId);
});
</script>
</body>
</html>
